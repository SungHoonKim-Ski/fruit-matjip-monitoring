apiVersion: 1

# 파일에서 규칙을 빼도 Grafana에 등록된 규칙은 남는다 — uid로 지운다.
# 한 번 반영된 뒤에는 지워도 된다(9876b7a → 0b57665 선례).
deleteRules:
  - orgId: 1
    uid: active-orders-high

groups:
  - orgId: 1
    name: onuljang-infra
    folder: Onuljang Alerts
    interval: 1m
    rules:
      - uid: heap-high
        title: JVM Heap 사용률 높음
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"} * 100
              instant: true
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [85]
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "JVM Heap 사용률 {{ $value | printf \"%.0f\" }}%"

      - uid: hikaricp-pending
        title: HikariCP 대기 커넥션 과다
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: hikaricp_connections_pending
              instant: true
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "HikariCP 대기 커넥션 {{ $value }}개"

      - uid: http-5xx-count
        title: HTTP 5xx 응답 발생
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(http_server_requests_seconds_count{status=~"5.."}[5m]))
              instant: true
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx 응답 {{ $value | printf \"%.0f\" }}건 (최근 5분)"

      - uid: cpu-high
        title: CPU 사용률 높음
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: system_cpu_usage * 100
              instant: true
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU 사용률 {{ $value | printf \"%.0f\" }}%"

  - orgId: 1
    name: onuljang-business
    folder: Onuljang Alerts
    interval: 5m
    rules:
      - uid: negative-stock
        title: 재고 음수 감지
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: onuljang_negative_stock_products
              instant: true
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "재고 음수 상품 {{ $value }}개"

      - uid: payment-failure-rate
        title: PG 결제 실패 (시스템 오류)
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                sum(increase(onuljang_payment_failure_total{reason="system"}[10m]))
              instant: true
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PG 시스템 결제 실패 {{ $value }}건 (최근 10분)"

  - orgId: 1
    name: onuljang-delivery
    folder: Onuljang Alerts
    interval: 5m
    rules:
      - uid: tracking-failure-rate
        title: 배송 트래킹 요청 실패율 높음
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                sum(increase(onuljang_tracking_requests_total{result="fail"}[10m]))
                / (sum(increase(onuljang_tracking_requests_total[10m])) > 0) * 100
              instant: true
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [30]
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "배송 트래킹 실패율 {{ $value | printf \"%.0f\" }}% (최근 10분)"

      # 발주완료·배송중 총량은 하루 주문량만 따라 오르내려 적체를 가리지 못한다.
      # 나가 있는 운송장이 마지막 이동(배송 조회 이벤트, 없으면 발급·발송일) 뒤 5일(BE BusinessGaugeMetrics.COURIER_STUCK_DAYS) 넘게
      # 움직이지 않은 주문이 한 건이라도 있으면 울린다.
      # max: 블루그린 전환 중 두 JVM이 같은 DB 건수를 함께 내보내도 두 배로 세지 않는다.
      - uid: courier-orders-stuck
        title: 택배 주문 장기 정체
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(onuljang_courier_stuck_orders)
              instant: true
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "운송장이 5일 넘게 움직이지 않은 택배 주문 {{ $value }}건 — 어드민 택배 주문에서 확인"

  - orgId: 1
    name: onuljang-payment
    folder: Onuljang Alerts
    interval: 5m
    rules:
      - uid: pg-approval-slow
        title: PG 결제 승인 지연 (p95 > 5s)
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, sum(rate(onuljang_payment_approval_seconds_bucket[10m])) by (le))
              instant: true
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "PG 결제 승인 p95 {{ $value | printf \"%.1f\" }}초"

      - uid: notification-failure-spike
        title: 알림톡 발송 실패 급증
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(onuljang_notifications_total{result="fail"}[10m]))
              instant: true
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "알림톡 발송 실패 {{ $value }}건 (최근 10분)"

      - uid: payment-reconcile-mismatch
        title: 통합 결제 환불 정합 불일치 감지
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum by (direction) (increase(onuljang_payment_reconcile_mismatch_total[2h]))
              instant: true
          - refId: C
            relativeTimeRange:
              from: 7200
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "결제 정합 불일치 {{ $value }}건 (direction={{ $labels.direction }}, 최근 2시간)"
          description: |
            방향: {{ $labels.direction }}
            불일치 건수: {{ $value }}건 (최근 2시간)

            direction=A → 고객 미수령 위험 (환불이 고객에게 도달하지 않았을 가능성)
            direction=B → 이중지급 위험 (환불이 중복 처리됐을 가능성)

            ⚠️ 탐지 전용 알림이다. 자동 환불·자동 조치는 수행되지 않는다.
            운영자가 직접 결제 정합을 확인하고 처리할 것.
            RESOLVED는 2시간 윈도우가 지났다는 의미일 뿐 불일치가 해소된 것이 아니다.

      - uid: refund-pg-unrecorded
        title: 결제사 환불만 되고 기록되지 않은 관리자 환불
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: max(onuljang_refund_pg_unrecorded)
              instant: true
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "결제사 환불만 되고 기록되지 않은 환불 {{ $value }}건"
          description: |
            카드 환불은 나갔는데 환불 기록이 롤백된 주문서가 있다. 그 주문서는 새 환불이 막혀 있다.
            어드민 주문서 상세의 경고에서 '기록 다시 시도' 또는 결제사 콘솔 확인 후 '수동 정리 완료'로 푼다.
            DB: SELECT * FROM refund_pg_traces WHERE status = 'PG_DONE';
            지표는 5분마다 갱신된다 — 정리 뒤 RESOLVED까지 최대 5분 걸린다.

      - uid: refund-pg-cancel-failure
        title: 관리자 환불 결제사 취소 실패·기록 실패
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum by (path, result) (increase(onuljang_refund_pg_cancel_total{result=~"fail|unrecorded"}[10m]))
              instant: true
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "관리자 환불 결제사 {{ $labels.result }} {{ $value }}건 ({{ $labels.path }}, 최근 10분)"
          description: |
            result=fail: 결제사 취소 호출이 실패했다. 환불은 나가지 않았고 DB도 그대로다(운영자가 다시 시도하면 된다).
            result=unrecorded: 결제사 취소는 됐는데 그 뒤 단계가 실패해 기록이 롤백됐다. '결제사 환불만 되고 기록되지 않은 관리자 환불' 알림과 같은 건이다.
            경로(path): ITEMS=환불 창, SINGLE=옛 단건, BULK=옛 일괄.

  - orgId: 1
    name: onuljang-slow-query
    folder: Onuljang Alerts
    interval: 1m
    rules:
      # 500ms 초과 1건 즉시 감지 — 규칙은 유지한다(운영자 결정 2026-09-15, 감지 자체를 끄는 안은 반려).
      # improvable="true"만 세므로 known-slow-queries.yml 등재 query_id는 제외된다.
      # query_id별 Timer(app_slow_query_seconds)가 아니라 전용 Counter를 읽는다 — Timer 시리즈는 첫 관측 때 값 1로 태어나
      # increase()가 그 첫 건을 못 센다(prod 실측 c191f4a5, 2026-09-16). 이 Counter는 BE 기동 시 0으로 등록된다.
      # 이름·경계는 BE SlowQueryObservationHandler.OVER_THRESHOLD_METRIC과 짝 — 한쪽을 바꾸면 다른 쪽도 바꾼다.
      - uid: slow-query-count
        title: Slow Query 발생 (improvable, 500ms 초과)
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum(increase(app_slow_query_over500ms_total{improvable="true"}[5m]))
              instant: true
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "500ms 초과 improvable 쿼리 {{ $value | printf \"%.0f\" }}건 (최근 5분, known-slow 제외)"

      # app_slow_query metric: BE에서 100ms 초과 JDBC 쿼리에만 query_id + improvable 라벨로 기록.
      # improvable="true" 만 알람 대상 — known-slow-queries.yml 등재 query_id 는 자동 제외.
      # BE 신규 부팅 후 ~5분 metric 적재 대기 후 발화 안정.

      - uid: slow-query-new-burst
        title: 새 slow query burst 감지 (improvable, 분당 3건+)
        condition: C
        noDataState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum by (query_id) (rate(app_slow_query_seconds_count{improvable="true"}[5m]))
              instant: true
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.05]
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "신규 slow query id={{ $labels.query_id }} — 분당 {{ $value | printf \"%.1f\" }}건 (개선 후보 또는 known-slow 등재)"

      - uid: slow-query-critical
        title: Slow query p95 > 1s 지속 (improvable)
        condition: C
        noDataState: OK
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, sum by (le) (rate(app_slow_query_seconds_bucket{improvable="true"}[10m])))
              instant: true
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [1]
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "improvable slow query p95 {{ $value | printf \"%.0f\" }}ms — 10분 이상 지속, 시스템 전반 부하"

      - uid: scheduler-failure
        title: 스케줄러 실행 실패
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: sum by (scheduler, method) (increase(onuljang_scheduler_duration_seconds_count{result="failure"}[10m]))
              instant: true
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.scheduler }}.{{ $labels.method }} 실패 {{ $value }}건 (최근 10분)"
          description: |
            스케줄러: {{ $labels.scheduler }}
            메서드: {{ $labels.method }}
            실패 횟수: {{ $value }}건 (최근 10분)

            ⚠️ RESOLVED는 10분 윈도우가 지났다는 의미일 뿐 결함이 해소된 것이 아니다.
            매일 1회 실행되는 cron이면 다음 실행은 24시간 후이므로 RESOLVED 후에도 데이터 결함은 남아 있을 수 있다.
            데이터 정합성을 직접 검증한 후에만 안전하다고 판단할 것.


  - orgId: 1
    name: onuljang-admin-security
    folder: Onuljang Alerts
    interval: 1m
    rules:
      # 관리자가 처음 보는 IP 대역(IPv4 /16, IPv6 /48)에서 로그인했거나, 자동 로그인 세션의 IP가 새 대역으로 바뀌면 울린다.
      # BE AdminNewNetworkWatcher가 대역마다 onuljang_admin_new_network_total{admin_id}를 1 올린다(fruit-matjip-be#878).
      # IP는 카디널리티 때문에 라벨에 없다 — 이름·대역·새 IP·이전 IP는 앱 로그 [AdminNewNetwork] WARN에만 있다.
      # 이 카운터는 admin_id마다 첫 증가 때 값 1로 태어나 increase()가 그 첫 건을 못 센다(slow-query-count 주석과 같은 이유).
      # 그래서 "10분 전에는 없던 시리즈"를 or로 함께 본다. 왼쪽의 > 0은 지우면 안 된다 — 갓 태어난 시리즈는 increase가 0을 내고,
      # or는 같은 admin_id면 왼쪽을 남기므로 그 0이 오른쪽의 1을 가린다.
      # sum by (admin_id): 블루그린 두 자리(9090·9091)를 합친다. 각 JVM은 자기가 본 이벤트만 센다.
      # 알림이 없는 것이 정상이고 BE 배포 전에는 메트릭 자체가 없다 — noDataState: OK.
      - uid: admin-new-network
        title: 관리자 처음 보는 IP 대역 접속
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                (sum by (admin_id) (increase(onuljang_admin_new_network_total[10m])) > 0)
                or
                sum by (admin_id) (onuljang_admin_new_network_total unless onuljang_admin_new_network_total offset 10m)
              instant: true
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 0s
        labels:
          severity: warning
        annotations:
          summary: "관리자 admin_id={{ $labels.admin_id }} 처음 보는 IP 대역 접속 (최근 10분)"
          description: |
            관리자 id: {{ $labels.admin_id }}
