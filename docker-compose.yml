services:
  prometheus:
    # 버전 고정: ops 박스로 옮기며 prod의 TSDB 볼륨을 그대로 가져왔다. latest를 새로 받으면 데이터 형식이 바뀔 수 있다.
    image: prom/prometheus:v3.11.0
    container_name: onuljang-prometheus
    # ops 박스는 스왑이 없고 Redis와 메모리를 나눠 쓴다. 상한을 넘기면 Redis가 아니라 이 컨테이너가 죽게 한다.
    mem_limit: 512m
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=5GB'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    # 버전 고정: grafana.db를 prod에서 옮겨 왔다. 새 버전은 기동 때 DB를 바꿔 되돌리기가 어렵다.
    image: grafana/grafana:12.4.2
    container_name: onuljang-grafana
    mem_limit: 256m
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DATE_FORMATS_DEFAULT_TIMEZONE=Asia/Seoul
      # SMTP (AWS SES)
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=${GRAFANA_SMTP_HOST:-email-smtp.ap-northeast-2.amazonaws.com:587}
      - GF_SMTP_USER=${GRAFANA_SMTP_USER}
      - GF_SMTP_PASSWORD=${GRAFANA_SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${GRAFANA_SMTP_FROM}
      - GF_SMTP_STARTTLS_POLICY=MandatoryStartTLS
      # Alert contact point env
      - GRAFANA_SLACK_WEBHOOK_URL=${GRAFANA_SLACK_WEBHOOK_URL}
      - GRAFANA_ALERT_EMAIL=${GRAFANA_ALERT_EMAIL}
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
